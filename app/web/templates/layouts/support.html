<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{{ sp.title }}{% endblock %} · Technical Support</title>
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#4338ca">
    <link rel="icon" href="{{ url_for('static', path='images/favicon.ico') }}" sizes="any">
    <link rel="icon" type="image/png" sizes="32x32" href="{{ url_for('static', path='images/favicon-32x32.png') }}">
    <link rel="preload" href="{{ url_for('static', path='vendor/fonts/v1/inter-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/fonts/v1/fonts.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='vendor/fontawesome/6.4.0/css/all.min.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='css/support.css') }}?v=8">
    <script src="{{ url_for('static', path='vendor/htmx/2.0.6/htmx.min.js') }}" defer></script>
    {% block styles %}{% endblock %}
</head>
<body class="sp-body" data-sp-live="/ws/support" data-sp-user="{{ sp.user_id }}">
<div class="sp-app">
    {% include "support/partials/sidebar.html" %}
    <div class="sp-scrim" data-sp-nav-toggle></div>

    <div class="sp-main">
        {% include "support/partials/topbar.html" %}
        <main class="sp-content" id="sp-content">
            {% block content %}{% endblock %}
        </main>
    </div>
</div>

<div class="sp-toasts" id="sp-toasts" aria-live="polite"></div>

<script src="{{ url_for('static', path='js/support.js') }}?v=3" defer></script>
<script src="{{ url_for('static', path='js/support_live.js') }}?v=1" defer></script>
{% block scripts %}{% endblock %}
</body>
</html>
