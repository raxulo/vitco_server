<!DOCTYPE html>
<html lang="en">

<head>

    {% include "partials/head.html" %}

    {% block styles %}{% endblock %}

</head>

<body>

    {% block body %}{% endblock %}


    <div class="toast" id="toast">

        <span id="toast-message"></span>
    </div>
    {# ?v= busts the browser cache when the error-popup handling changes #}
    <script src="{{ url_for('static', path='js/htmx.js') }}?v=3"></script>
    <script src="{{ url_for('static', path='js/app.main.js') }}?v=3"></script>
    <script src="{{ url_for('static', path='js/excel_exchange.js') }}?v=2"></script>
    {% block scripts %}  {% endblock %}

</body>

</html>
