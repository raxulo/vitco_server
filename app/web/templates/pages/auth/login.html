{% extends "layouts/auth.html" %}

{% block title %}Login - VITCO{% endblock %}

{% block styles %}
<style>
    body {
        background: radial-gradient(circle at 50% 50%, #f0fdf4, #dbeafe) !important; /* Soft green pastures to sky blue gradient background */
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Outfit', 'Inter', system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        overflow: auto;
    }

    .login-container-card {
        background: #f3f5f9; /* Light grey base card */
        border-radius: 40px;
        width: 100%;
        max-width: 980px;
        min-height: 600px;
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        padding: 20px;
        box-shadow: 0 25px 60px -15px rgba(0, 0, 0, 0.25);
        gap: 32px;
        align-items: center;
        animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    @keyframes slideUp {
        from { opacity: 0; transform: translateY(30px); }
        to { opacity: 1; transform: translateY(0); }
    }

    /* Left Form Column */
    .login-form-side {
        padding: 40px;
        display: flex;
        flex-direction: column;
        justify-content: center;
    }

    .login-form-side h1 {
        font-size: 42px;
        font-weight: 800;
        color: #0f172a;
        margin: 0 0 8px 0;
        letter-spacing: -0.04em;
        text-align: left;
    }

    .login-form-side .subtitle {
        font-size: 15px;
        color: #64748b;
        margin: 0 0 36px 0;
        font-weight: 500;
        text-align: left;
    }

    /* Form control styling overrides to match image */
    .form-group {
        margin-bottom: 24px;
        text-align: left;
    }
    .form-group label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 700;
        color: #475569;
        text-transform: uppercase;
        letter-spacing: 0.05em;
    }
    .input-wrapper {
        position: relative;
    }
    /* Hide default icons inside inputs to match mockup */
    .input-wrapper i {
        display: none !important;
    }
    .input-wrapper input {
        width: 100%;
        padding: 16px 20px !important;
        background: white;
        border: none;
        border-radius: 16px;
        color: #0f172a;
        font-size: 15px;
        font-weight: 500;
        transition: all 0.2s;
        outline: none;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
    }
    .input-wrapper input:focus {
        box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15);
    }

    /* Show / hide password button inside the password box */
    .input-wrapper input#password {
        padding-right: 52px !important;
    }
    .password-toggle {
        position: absolute;
        top: 50%;
        right: 10px;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        border: none;
        border-radius: 10px;
        background: transparent;
        color: #64748b;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s, color 0.2s;
    }
    .password-toggle:hover {
        background: #f1f5f9;
        color: #2563eb;
    }
    .password-toggle:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 2px;
    }
    .input-wrapper .password-toggle i {
        display: inline-block !important; /* overrides the "hide input icons" rule above */
        font-size: 16px;
    }
    /* Edge / IE show their own reveal button; keep only ours */
    input#password::-ms-reveal,
    input#password::-ms-clear {
        display: none;
    }

    .login-form-side .btn-primary {
        background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%) !important; /* Brand blue button */
        color: white !important;
        border: none;
        border-radius: 16px;
        padding: 16px;
        font-size: 16px;
        font-weight: 700;
        width: 100%;
        cursor: pointer;
        box-shadow: 0 8px 20px -6px rgba(37, 99, 235, 0.4);
        transition: all 0.25s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }
    .login-form-side .btn-primary:hover {
        background: #1d4ed8 !important;
        transform: translateY(-1px);
        box-shadow: 0 12px 24px -6px rgba(37, 99, 235, 0.55);
    }

    #error-msg {
        color: #ef4444;
        font-size: 14px;
        font-weight: 600;
        margin-top: 20px;
        text-align: center;
        padding: 12px;
        background: #fef2f2;
        border-radius: 12px;
        border: 1px solid rgba(239, 68, 68, 0.15);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
    }

    /* Right Image Column */
    .login-image-side {
        width: 100%;
        height: 100%;
        min-height: 560px;
        border-radius: 32px;
        overflow: hidden;
        position: relative;
    }

    .login-image-side img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        position: absolute;
        top: 0;
        left: 0;
    }

    /* Social Login Icons */
    .social-login-group {
        display: flex;
        justify-content: center;
        gap: 16px;
        margin-top: 36px;
    }
    .social-btn {
        width: 52px;
        height: 52px;
        background: white;
        border-radius: 16px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        transition: all 0.2s;
        cursor: pointer;
        border: 1px solid rgba(226, 232, 240, 0.8);
    }
    .social-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 16px rgba(0, 0, 0, 0.08);
    }
    .social-btn.google { color: #ea4335; }
    .social-btn.apple { color: #000000; }
    .social-btn.facebook { color: #1877f2; }

    @media (max-width: 900px) {
        .login-container-card {
            grid-template-columns: 1fr;
            padding: 16px;
            max-width: 480px;
        }
        .login-image-side {
            display: none;
        }
        .login-form-side {
            padding: 20px 10px;
        }
    }
</style>
{% endblock %}

{% block content %}
<div class="login-container-card">
    <!-- Left Column -->
    <div class="login-form-side">
        <h1>Login</h1>
        <p class="subtitle">Welcome back! Please enter your details.</p>

        <form id="login-form" hx-post="/auth/login" hx-target="#login-form" hx-swap="innerHTML" hx-indicator="#login-spinner">
            {% include 'components/forms/login_form.html' %}
        </form>

        <div class="social-login-group">
            <div class="social-btn google">
                <i class="fa-brands fa-google"></i>
            </div>
            <div class="social-btn apple">
                <i class="fa-brands fa-apple"></i>
            </div>
            <div class="social-btn facebook">
                <i class="fa-brands fa-facebook-f"></i>
            </div>
        </div>
    </div>

    <!-- Right Column -->
    <div class="login-image-side">
        <img src="{{ url_for('static', path='images/login_side_vector.png') }}" alt="VITCO Portal Banner">
    </div>
</div>
{% endblock %}
