{# Vendor assets are self-hosted under static/vendor/<name>/<version>/ (cached for a year,
   see app/web/mount.py); a new version means a new folder, so no cache busting is needed. #}

<!-- Fonts used on first paint: start downloading before the CSS asks for them -->
<link rel="preload" href="{{ url_for('static', path='vendor/fonts/v1/outfit-latin.woff2') }}" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="{{ url_for('static', path='vendor/fontawesome/6.4.0/webfonts/fa-solid-900.woff2') }}" as="font" type="font/woff2" crossorigin>

<!-- Fonts -->
<link rel="stylesheet" href="{{ url_for('static', path='vendor/fonts/v1/fonts.css') }}">

<!-- Icons -->
<link rel="stylesheet" href="{{ url_for('static', path='vendor/fontawesome/6.4.0/css/all.min.css') }}">
<link rel="stylesheet" href="{{ url_for('static', path='css/app.min.css?reload=67') }}">
<script src="{{ url_for('static', path='vendor/htmx/2.0.6/htmx.min.js') }}" defer></script>
<script src="{{ url_for('static', path='vendor/sweetalert2/11.26.25/sweetalert2.all.min.js') }}" defer></script>
