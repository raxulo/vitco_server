<!-- CART SCRIPT -->
<script>
window.VitcoCart = {
    STORAGE_KEY: 'vitco_marketplace_cart',

    getItems: function() {
        try {
            return JSON.parse(localStorage.getItem(this.STORAGE_KEY)) || [];
        } catch (e) {
            return [];
        }
    },

    setItems: function(items) {
        try {
            localStorage.setItem(this.STORAGE_KEY, JSON.stringify(items));
        } catch (e) {}
        this.updateUI();
    },

    addItem: function(id, kind, title, price, image, unit, seller, qty = 1, openDrawerAfter = false) {
        let items = this.getItems();
        let existing = items.find(i => String(i.id) === String(id) && i.kind === kind);
        if (existing) {
            existing.quantity += (Number(qty) || 1);
        } else {
            items.push({
                id: String(id),
                kind: kind || 'product',
                title: title || 'Item',
                price: Number(price) || 0,
                image: image || '/static/images/logo.png',
                unit: unit || (kind === 'animal' ? 'Cattle Listing' : 'Farm Product'),
                seller: seller || 'Vitco Marketplace',
                quantity: Number(qty) || 1
            });
        }
        this.setItems(items);
        this.showToast(`"${title || 'Item'}" added to cart!`);
        if (openDrawerAfter) {
            openCartDrawer();
        }
    },

    updateQuantity: function(id, kind, delta) {
        let items = this.getItems();
        let idx = items.findIndex(i => String(i.id) === String(id) && i.kind === kind);
        if (idx !== -1) {
            items[idx].quantity += delta;
            if (items[idx].quantity <= 0) {
                items.splice(idx, 1);
            }
            this.setItems(items);
        }
    },

    removeItem: function(id, kind) {
        let items = this.getItems().filter(i => !(String(i.id) === String(id) && i.kind === kind));
        this.setItems(items);
        this.showToast("Item removed from cart.");
    },

    clearCart: function() {
        this.setItems([]);
        this.showToast("Cart cleared.");
    },

    getTotalCount: function() {
        return this.getItems().reduce((sum, i) => sum + (i.quantity || 1), 0);
    },

    getTotalAmount: function() {
        return this.getItems().reduce((sum, i) => sum + ((i.price || 0) * (i.quantity || 1)), 0);
    },

    showToast: function(msg) {
        let toast = document.getElementById('vitco-toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'vitco-toast';
            toast.className = 'vitco-toast';
            document.body.appendChild(toast);
        }
        toast.innerHTML = `<i class="fa-solid fa-circle-check" style="color:#10b981; font-size: 16px;"></i> ${msg}`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 3200);
    },

    updateUI: function() {
        const count = this.getTotalCount();

        // Update topbar & navbar cart badges
        document.querySelectorAll('.cart-badge-count').forEach(el => {
            el.innerText = count;
            el.style.display = count > 0 ? 'inline-flex' : 'none';
        });

        // Update drawer header badge
        const drawerBadge = document.getElementById('cart-drawer-count-badge');
        if (drawerBadge) drawerBadge.innerText = `${count} ${count === 1 ? 'Item' : 'Items'}`;

        // Render drawer body content
        renderCartDrawerContent();
    }
};

function renderCartDrawerContent() {
    const body = document.getElementById('cart-drawer-body');
    const footer = document.getElementById('cart-drawer-footer');
    if (!body) return;

    const items = VitcoCart.getItems();
    const amount = VitcoCart.getTotalAmount();

    const subtotalEl = document.getElementById('cart-subtotal-val');
    const totalEl = document.getElementById('cart-total-val');
    if (subtotalEl) subtotalEl.innerText = '₹' + amount.toLocaleString('en-IN');
    if (totalEl) totalEl.innerText = '₹' + amount.toLocaleString('en-IN');

    if (items.length === 0) {
        body.innerHTML = `
            <div class="cart-empty-state">
                <div class="cart-empty-icon">
                    <i class="fa-solid fa-cart-flatbed"></i>
                </div>
                <h4 style="margin: 0 0 6px 0; color: #0f172a; font-weight: 800; font-size: 16px;">Your Cart is Empty</h4>
                <p style="margin: 0 0 20px 0; font-size: 12px; color: #64748b;">Browse verified livestock cattle & farm products feeds to add to your cart.</p>
                <a href="/marketplace" onclick="closeCartDrawer()" class="btn-clean-primary" style="text-decoration: none; padding: 10px 20px; font-size: 13px;">
                    <i class="fa-solid fa-store"></i> Browse Marketplace
                </a>
            </div>
        `;
        if (footer) footer.style.display = 'none';
        return;
    }

    if (footer) footer.style.display = 'flex';

    body.innerHTML = items.map(item => `
        <div class="cart-item-card">
            <img src="${item.image || '/static/images/logo.png'}" alt="${item.title}" class="cart-item-img">
            <div class="cart-item-details">
                <div class="cart-item-title">${item.title}</div>
                <div class="cart-item-unit"><i class="fa-solid fa-tag text-emerald"></i> ${item.unit} • ${item.seller}</div>
                <div class="cart-item-price">₹${((item.price || 0) * (item.quantity || 1)).toLocaleString('en-IN')}</div>
                <div class="cart-qty-ctrl">
                    <button type="button" class="cart-qty-btn" onclick="VitcoCart.updateQuantity('${item.id}', '${item.kind}', -1)">-</button>
                    <span class="cart-qty-val">${item.quantity}</span>
                    <button type="button" class="cart-qty-btn" onclick="VitcoCart.updateQuantity('${item.id}', '${item.kind}', 1)">+</button>
                </div>
            </div>
            <button type="button" class="cart-item-remove" onclick="VitcoCart.removeItem('${item.id}', '${item.kind}')" title="Remove item">
                <i class="fa-solid fa-trash-can"></i>
            </button>
        </div>
    `).join('');
}

function handleAddToCartClick(e, btn) {
    if (e) {
        if (e.stopPropagation) e.stopPropagation();
        if (e.preventDefault) e.preventDefault();
    }
    if (!btn) return;
    const id = btn.getAttribute('data-id');
    const kind = btn.getAttribute('data-kind') || 'product';
    const title = btn.getAttribute('data-title') || 'Item';
    const price = btn.getAttribute('data-price') || 0;
    const image = btn.getAttribute('data-image') || '';
    const unit = btn.getAttribute('data-unit') || 'Unit';
    const seller = btn.getAttribute('data-seller') || 'Vitco Marketplace';

    VitcoCart.addItem(id, kind, title, price, image, unit, seller, 1, true);
}

function openCartDrawer() {
    const overlay = document.getElementById('cart-drawer-overlay');
    const drawer = document.getElementById('cart-drawer');
    if (overlay) overlay.classList.add('active');
    if (drawer) drawer.classList.add('active');
    document.body.style.overflow = 'hidden';
    VitcoCart.updateUI();
}

function closeCartDrawer() {
    const overlay = document.getElementById('cart-drawer-overlay');
    const drawer = document.getElementById('cart-drawer');
    if (overlay) overlay.classList.remove('active');
    if (drawer) drawer.classList.remove('active');
    document.body.style.overflow = '';
}

function toggleCartDrawer() {
    const drawer = document.getElementById('cart-drawer');
    if (drawer && drawer.classList.contains('active')) {
        closeCartDrawer();
    } else {
        openCartDrawer();
    }
}

function openCheckoutModal() {
    const items = VitcoCart.getItems();
    if (items.length === 0) {
        VitcoCart.showToast("Your cart is empty!");
        return;
    }
    closeCartDrawer();
    const countEl = document.getElementById('checkout-item-count');
    const totalEl = document.getElementById('checkout-total-amount');
    const modal = document.getElementById('cart-checkout-modal');

    if (countEl) countEl.innerText = `${VitcoCart.getTotalCount()} items`;
    if (totalEl) totalEl.innerText = '₹' + VitcoCart.getTotalAmount().toLocaleString('en-IN');
    if (modal) modal.classList.add('active');
    document.body.style.overflow = 'hidden';
}

function closeCheckoutModal() {
    const modal = document.getElementById('cart-checkout-modal');
    if (modal) modal.classList.remove('active');
    document.body.style.overflow = '';
}

async function submitCartOrder(e) {
    if (e) e.preventDefault();
    const nameEl = document.getElementById('order-user-name');
    const phoneEl = document.getElementById('order-user-phone');
    const addressEl = document.getElementById('order-user-address');

    const name = nameEl ? nameEl.value : 'Buyer';
    const phone = phoneEl ? phoneEl.value : '';
    const address = addressEl ? addressEl.value : '';
    const payment = 'COD';
    const orderRef = 'VIT-' + Math.floor(100000 + Math.random() * 900000);
    const items = VitcoCart.getItems();
    const totalAmount = VitcoCart.getTotalAmount();

    try {
        await fetch('/marketplace/order/create', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                order_ref: orderRef,
                buyer_name: name,
                buyer_phone: phone,
                delivery_address: address,
                payment_method: payment,
                total_amount: totalAmount,
                items: items
            })
        });
    } catch (err) {
        console.log('Order created:', err);
    }

    closeCheckoutModal();
    VitcoCart.clearCart();
    alert(`🎉 Order Confirmed!\n\nOrder Ref: #${orderRef}\nBuyer: ${name}\nPhone: ${phone}\n\nThank you for ordering on Vitco Marketplace! Seller/Delivery team will contact you shortly.`);
}

// Initialized on load
document.addEventListener('DOMContentLoaded', function() {
    VitcoCart.updateUI();
});
</script>
