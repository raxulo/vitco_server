<header class="sp-topbar">
    <button type="button" class="sp-btn is-ghost is-icon sp-menu-btn" data-sp-nav-toggle aria-label="Open menu">
        <i class="fa-solid fa-bars"></i>
    </button>
    <h1 class="sp-topbar-title">{{ sp.title }}</h1>
    <div class="sp-topbar-spacer"></div>

    <span class="sp-live" id="sp-live" role="status" aria-live="polite" hidden>Connecting</span>
    {# Before the page is painted: start as Live when the previous page was live a moment ago (support_live.js
       keeps that in sessionStorage), so moving between pages does not make the badge blink #}
    <script>
        (function () {
            try {
                var saved = (window.sessionStorage.getItem('sp-live') || '').split(':');
                var badge = document.getElementById('sp-live');
                if (badge && saved[0] === 'live' && Date.now() - Number(saved[1]) < 15000) {
                    badge.hidden = false; badge.textContent = 'Live'; badge.className = 'sp-live is-live';
                }
            } catch (ignore) { /* private mode: the badge appears with the first hello instead */ }
        })();
    </script>

    <div class="sp-menu">
        <button type="button" class="sp-menu-trigger" aria-haspopup="menu" aria-expanded="false">
            <span class="sp-avatar">{{ sp.initials }}</span>
            <span class="sp-menu-name">{{ sp.user_name }}<small>{{ sp.role_label }}</small></span>
            <i class="fa-solid fa-chevron-down" style="font-size:10px;color:var(--sp-muted)"></i>
        </button>
        <div class="sp-menu-panel" role="menu">
            {% if sp.back_to_dairy %}<a href="/dashboard" role="menuitem"><i class="fa-solid fa-arrow-left"></i>Dairy panel</a>{% endif %}
            <button type="button" class="sp-menu-item" role="menuitemcheckbox" aria-checked="false" data-sp-alerts>
                <i class="fa-solid fa-bell"></i><span>Sound and desktop alerts</span><small data-sp-alerts-state>Off</small>
            </button>
            <a href="/logout" role="menuitem"><i class="fa-solid fa-arrow-right-from-bracket"></i>Sign out</a>
        </div>
    </div>
</header>
